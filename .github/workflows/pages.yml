# Sentinel OceanWATCH - publishes the web app (folder www/) to GitHub Pages on every push to main.
# One-time: repo Settings > Pages > Source: "GitHub Actions".
name: Web app (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # built in one job and published in the next (GitHub's own pattern): the deploy step then always finds the uploaded site
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests (no internet, no browser)
        run: node tests/unit.js && node tests/edition.js
      - name: Offline file list (new version on every change)
        run: node tools/build-precache.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
